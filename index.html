<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trixtern</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section>
        <div class="container">
            <h1>Trixtern Technologies</h1>
            <div class="countdown" id="countdown"></div>
            <p>Coming soon...</p>
            <div class="countdown" id="countdown"></div>
        </div>
    </section>
    <footer>
        <span> &reg 2024</span>
    </footer>
</body>
<script>
    // Set the target date for the countdown
    const targetDate = new Date("April 11, 2025 12:00:00").getTime();

    // Update the countdown every second
    const countdownInterval = setInterval(() => {
        const now = new Date().getTime();
        const timeLeft = targetDate - now;

        if (timeLeft <= 0) {
            clearInterval(countdownInterval);
            document.getElementById("countdown").innerHTML = `<p>The wait is over! Trixtern is here! 🎉<p><a href="https://new.trixtern.com">Click here if not redirected yet!</a>;` 
            return;
        }

        // Calculate days, hours, minutes, and seconds
        const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
        const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

        // Display the countdown
        document.getElementById("countdown").innerHTML = 
            `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }, 1000);
</script>
</html>
